<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTMC · Teacher Lesson Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#1d4ed8;--pd:#0b2545;--pl:#eff6ff;--bd:#e2e8f0;--mut:#64748b;--bg:#f6f8fb;--ok:#15803d;--bad:#dc2626;--am:#fffbeb;--amt:#92400e}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:#0f172a;padding-bottom:90px;-webkit-font-smoothing:antialiased}
.top{background:linear-gradient(120deg,var(--pd),#1e4d8c);color:#fff}
.top-in,.wrap{max-width:1100px;margin:0 auto;padding:0 1rem}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:.9rem;padding-bottom:.9rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem}
.logo{width:40px;height:40px;border-radius:11px;background:#fff;color:var(--p);display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:1.02rem}.brand small{opacity:.75;font-size:.75rem}
.who{display:flex;align-items:center;gap:.6rem}
.badge-a{background:rgba(255,255,255,.18);padding:.25rem .7rem;border-radius:99px;font-size:.75rem;font-weight:700}
nav{background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:20}
nav .wrap{display:flex;gap:.25rem;overflow-x:auto}
nav button{border:0;background:none;padding:.85rem 1rem;font:600 .88rem Inter;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--p);border-color:var(--p)}
.wrap{padding-top:1.2rem}
.btn{border:0;border-radius:10px;padding:.65rem 1.1rem;font:600 .86rem Inter;cursor:pointer;background:var(--p);color:#fff;transition:.15s}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:#334155;border:1.5px solid var(--bd)}
.top .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.btn.ok{background:var(--ok)}.btn.red{background:#fff;color:var(--bad);border:1.5px solid #fecaca;padding:.35rem .65rem;font-size:.78rem}
.btn.sm{padding:.4rem .75rem;font-size:.8rem}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;margin-bottom:1rem;overflow:hidden}
.ch{padding:.9rem 1.1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;gap:.7rem;flex-wrap:wrap}
.ch h3{font-size:.95rem;color:var(--pd)}.cb{padding:1.1rem}
.hint{color:var(--mut);font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1rem}
.stat{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--p);border-radius:12px;padding:.9rem 1rem}
.stat.g{border-left-color:var(--ok)}.stat.r{border-left-color:var(--bad)}
.stat small{display:block;color:var(--mut);font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.stat b{font-size:1.45rem;color:var(--pd);letter-spacing:-.5px}
.mn{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.mn b{min-width:150px;text-align:center;font-size:1rem;color:var(--pd)}
.mn .btn{padding:.45rem .8rem}
label{display:block;font-size:.72rem;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:.4px;margin-bottom:.3rem}
input,select{width:100%;padding:.7rem .85rem;font:500 .92rem Inter;border:1.5px solid var(--bd);border-radius:10px;background:#fff}
input:focus,select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px #dbeafe}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.9rem;align-items:end}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:.65rem 1rem;background:#f8fafc;white-space:nowrap}
td{padding:.75rem 1rem;border-top:1px solid #f1f5f9;vertical-align:middle}
tr[data-a=open]{cursor:pointer}tr[data-a=open]:hover{background:var(--pl)}
.n{font-weight:700;color:var(--pd)}.m{color:var(--mut);font-size:.78rem}
.pos{color:var(--ok);font-weight:700}.neg{color:var(--bad);font-weight:700}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--mut)}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.seg{display:inline-flex;border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:.5rem .9rem;font:600 .82rem Inter;cursor:pointer;color:#334155}
.seg button.on{background:var(--p);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:.68rem;font-weight:700;color:var(--mut);text-transform:uppercase;padding:.3rem 0}
.day{position:relative;min-height:66px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;padding:.35rem .45rem;user-select:none}
.day.blank{border:0;background:none}
.day.we{background:#fafafa}.day.hol{background:var(--am);border-color:#fcd34d}
.day.can{cursor:pointer}.day.can:hover{border-color:var(--p)}
.day.has{background:#dcfce7;border-color:#86efac}
.day.sel{background:#dbeafe;border-color:var(--p);box-shadow:0 0 0 2px var(--p) inset}
.dn{font-weight:700;font-size:.85rem}.hl{display:block;font-size:.6rem;color:var(--amt);font-weight:700}
.cnt{position:absolute;right:5px;bottom:5px;display:flex;gap:3px;align-items:center;font-size:.72rem;font-weight:800;color:var(--ok)}
.cnt i{font-style:normal;background:#fff;border:1px solid #fecaca;color:var(--bad);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.add{position:absolute;right:5px;bottom:5px;font-size:.72rem;font-weight:800;color:var(--p)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);box-shadow:0 -8px 24px -10px rgba(15,23,42,.25);padding:.8rem 1rem;z-index:30}
.bar div{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap}
.chip{display:inline-flex;gap:.4rem;align-items:center;background:var(--am);color:var(--amt);border:1px solid #fcd34d;padding:.3rem .7rem;border-radius:99px;font-size:.78rem;font-weight:600;margin:.2rem .3rem .2rem 0}
.chip button{border:0;background:none;color:var(--amt);cursor:pointer;font-size:1rem;line-height:1}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:#cbd5e1;position:relative;cursor:pointer}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--ok)}.sw.on::after{left:21px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;place-items:center;z-index:50;padding:1rem}
.modal.show{display:grid}.modal .box{background:#fff;border-radius:16px;padding:1.4rem;width:100%;max-width:380px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:.7rem 1.2rem;border-radius:10px;font-weight:600;z-index:60;display:none}
.toast.err{background:var(--bad)}
.fg{margin-bottom:.9rem}
@media(max-width:600px){.day{min-height:54px}.cnt,.add{font-size:.65rem}.stat b{font-size:1.2rem}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><div class="logo">GT</div><div><b>Teacher Lesson Dashboard</b><small>Greater Tomorrow Model College</small></div></div>
  <div class="who"><span class="badge-a" id="adm" style="display:none">Admin</span>
    <button class="btn ghost sm" data-a="refresh">⟳ Refresh</button>
    <button class="btn ghost sm" id="authBtn" data-a="login">Admin sign in</button></div>
</div></header>
<nav><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<div id="barHost"></div>

<div class="modal" id="lm"><div class="box">
  <h3 style="margin-bottom:1rem;color:var(--pd)">Admin sign in</h3>
  <form data-s="login">
    <div class="fg"><label>Username</label><input name="u" autocomplete="username" required></div>
    <div class="fg"><label>Password</label><input name="p" type="password" autocomplete="current-password" required></div>
    <div style="display:flex;gap:.6rem;justify-content:flex-end"><button type="button" class="btn ghost" data-a="closeLogin">Cancel</button><button class="btn">Sign in</button></div>
  </form>
</div></div>
<div class="toast" id="toast"></div>

<script>
const API='https://script.google.com/macros/s/AKfycbxge16jgrxp7J_Px2cKzBnPMktqlVt4_VKFzoKjcbEiRIrNXpZd6QCJOtwRH_BCopYl/exec';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdt=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const S={d:null,admin:sessionStorage.getItem('gtmc')==='1',tab:'overview',ym:iso(new Date()).slice(0,7),tk:'',ptk:'',pend:new Set(),per:1};
const D=()=>S.d, key=t=>t.teacher+'|'+t.subject+'|'+t.class;
const money=n=>D().rates.currency+Math.round(n).toLocaleString('en-NG');
const isWE=s=>[0,6].includes(pdt(s).getDay());
const isHol=s=>D().holidays.some(h=>h.date===s);
const rateOf=s=>(isWE(s)||isHol(s))?D().rates.weekend:D().rates.weekday;
const earned=(t,m)=>t.lessons.filter(l=>!m||l.date.startsWith(m)).reduce((a,l)=>a+rateOf(l.date),0);
const paid=(t,m)=>D().payments.filter(p=>p.teacher===t.teacher&&p.subject===t.subject&&p.class===t.class&&(!m||p.month===m)).reduce((a,p)=>a+p.amount,0);
const bal=t=>earned(t)-paid(t);
const T=()=>D().teachers.find(t=>key(t)===S.tk)||D().teachers[0];
const PT=()=>D().teachers.find(t=>key(t)===S.ptk)||D().teachers[0];
const mlabel=()=>{const[y,m]=S.ym.split('-');return MN[m-1]+' '+y};
const opts=(sel)=>D().teachers.map(t=>`<option value="${esc(key(t))}" ${key(t)===sel?'selected':''}>${esc(t.teacher)} — ${esc(t.subject)} (${esc(t.class)})</option>`).join('');

let tt;function toast(m,type,ms=2600){const t=$('#toast');t.textContent=m;t.className='toast'+(type==='err'?' err':'');t.style.display='block';clearTimeout(tt);if(ms)tt=setTimeout(()=>t.style.display='none',ms)}

async function api(action,p={}){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({action,...p})});
  const j=await r.json(); if(!j.ok)throw new Error(j.error||'Something went wrong');
  if(j.data)S.d=j.data; return j}
async function run(fn,okMsg){try{await fn();if(okMsg)toast('✓ '+okMsg)}catch(e){toast(e.message,'err',4000)}render()}
async function load(){
  try{const r=await fetch(API+'?action=getAll');const j=await r.json();if(!j.ok)throw new Error(j.error);S.d=j.data;
    if(!S.tk&&S.d.teachers[0])S.tk=S.ptk=key(S.d.teachers[0]);render()}
  catch(e){$('#main').innerHTML=`<div class="card empty">Could not load data.<br><span class="hint">${esc(e.message)}</span><br><br><button class="btn" data-a="refresh">Try again</button></div>`}}

/* ---------- VIEWS ---------- */
function monthNav(){return `<div class="mn"><button class="btn ghost" data-a="pm" data-v="-1">‹</button><b>${mlabel()}</b><button class="btn ghost" data-a="pm" data-v="1">›</button><button class="btn ghost sm" data-a="today">This month</button></div>`}

function overview(){
  const ts=D().teachers,m=S.ym;
  const les=t=>t.lessons.filter(l=>l.date.startsWith(m)).length;
  const L=ts.reduce((a,t)=>a+les(t),0), E=ts.reduce((a,t)=>a+earned(t,m),0);
  const P=D().payments.filter(x=>x.month===m).reduce((a,x)=>a+x.amount,0), O=ts.reduce((a,t)=>a+bal(t),0);
  const stats=S.admin?`<div class="stat"><small>Lessons · month</small><b>${L}</b></div><div class="stat"><small>Earned · month</small><b>${money(E)}</b></div><div class="stat g"><small>Paid · month</small><b>${money(P)}</b></div><div class="stat r"><small>Outstanding · all time</small><b>${money(O)}</b></div>`
   :`<div class="stat"><small>Teachers</small><b>${ts.length}</b></div><div class="stat"><small>Lessons · month</small><b>${L}</b></div>`;
  const rows=ts.map((t,i)=>{const sa=S.admin||t.showAmount;
    return `<tr data-a="open" data-v="${i}"><td><div class="n">${esc(t.teacher)}</div><div class="m">${esc(t.subject)} · ${esc(t.class)}</div></td><td><b>${les(t)}</b></td>
    <td>${sa?money(earned(t,m)):'—'}</td>${S.admin?`<td class="pos">${money(paid(t,m))}</td><td class="${bal(t)>0?'neg':'pos'}">${money(bal(t))}</td>`:''}<td style="text-align:right"><span class="btn ghost sm">${S.admin?'Record ›':'View ›'}</span></td></tr>`}).join('');
  return monthNav()+`<div class="stats">${stats}</div><div class="card"><div class="ch"><h3>Teachers · ${mlabel()}</h3>${S.admin?'<button class="btn ghost sm" data-a="export">⬇ Export CSV</button>':''}</div>
  <div class="tw"><table><thead><tr><th>Teacher</th><th>Lessons</th><th>Earned</th>${S.admin?'<th>Paid</th><th>Balance (all)</th>':''}<th></th></tr></thead><tbody>${rows||''}</tbody></table></div>
  ${ts.length?'':'<div class="empty">No teachers yet.'+(S.admin?' Go to the Teachers tab to add one.':'')+'</div>'}</div>
  <p class="hint">Tip: click a teacher to open their calendar.</p>`}

function calendar(){
  const ts=D().teachers; if(!ts.length)return '<div class="card empty">Add a teacher first.</div>';
  const t=T(),maxL=D().rates.maxLessonsPerDay,[y,mo]=S.ym.split('-').map(Number);
  const off=(new Date(y,mo-1,1).getDay()+6)%7,dim=new Date(y,mo,0).getDate();
  let c=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dow">${d}</div>`).join('')+'<div class="day blank"></div>'.repeat(off);
  for(let d=1;d<=dim;d++){const ds=`${y}-${pad(mo)}-${pad(d)}`,ls=t.lessons.filter(l=>l.date===ds),h=D().holidays.find(x=>x.date===ds);
    const can=S.admin&&ls.length<maxL,sel=S.pend.has(ds),add=Math.min(S.per,maxL-ls.length);
    c+=`<div class="day ${isWE(ds)?'we':''} ${h?'hol':''} ${ls.length?'has':''} ${sel?'sel':''} ${can?'can':''}" ${can?`data-a="pick" data-v="${ds}"`:''}><span class="dn">${d}</span>${h?`<span class="hl">${esc(h.note||'Holiday')}</span>`:''}
    ${ls.length?`<span class="cnt">${ls.length}✓${S.admin?`<i data-a="del" data-v="${ls[ls.length-1].rowIndex}" title="Remove one lesson">×</i>`:''}</span>`:''}${sel?`<span class="add">+${add}</span>`:''}</div>`}
  const ml=t.lessons.filter(l=>l.date.startsWith(S.ym)),sa=S.admin||t.showAmount;
  const tools=S.admin?`<div class="tools"><span class="hint">Lessons per day:</span><div class="seg">${[1,2].filter(n=>n<=maxL).map(n=>`<button class="${S.per===n?'on':''}" data-a="per" data-v="${n}">${n}</button>`).join('')}</div>
   <button class="btn ghost sm" data-a="wk">Select all weekdays</button><button class="btn ghost sm" data-a="clr">Clear selection</button></div><p class="hint" style="margin-bottom:.8rem">Tap the days taught, then press <b>Save</b>. Tap <b>×</b> on a green day to remove a lesson. Amber = holiday.</p>`:'';
  return monthNav()+`<div class="card"><div class="cb"><div class="fg" style="max-width:420px"><label>Teacher</label><select data-c="tk">${opts(key(t))}</select></div>${tools}<div class="cal">${c}</div></div></div>
  <div class="stats"><div class="stat"><small>Lessons this month</small><b>${ml.length}</b></div>${sa?`<div class="stat g"><small>Earned this month</small><b>${money(earned(t,S.ym))}</b></div>`:''}</div>`}

function bar(){
  if(S.tab!=='calendar'||!S.admin||!S.pend.size||!D().teachers.length)return '';
  const t=T(),maxL=D().rates.maxLessonsPerDay;let n=0,amt=0;
  S.pend.forEach(ds=>{const k=Math.min(S.per,maxL-t.lessons.filter(l=>l.date===ds).length);n+=k;amt+=k*rateOf(ds)});
  return `<div class="bar"><div><span><b>${S.pend.size}</b> day(s) · <b>${n}</b> lesson(s) · ${money(amt)}</span><span><button class="btn ghost" data-a="clr">Clear</button> <button class="btn ok" data-a="save">Save ${n} lesson(s)</button></span></div></div>`}

function payments(){
  const ts=D().teachers; if(!ts.length)return '<div class="card empty">Add a teacher first.</div>';
  const t=PT(),b=Math.max(0,bal(t)),today=iso(new Date());
  const hist=[...D().payments].reverse().slice(0,40).map(p=>`<tr><td>${esc(p.date)}</td><td><div class="n">${esc(p.teacher)}</div><div class="m">${esc(p.subject)} · ${esc(p.class)}</div></td><td>${esc(p.month)}</td><td class="pos">${money(p.amount)}</td><td class="m">${esc(p.note)}</td><td><button class="btn red" data-a="delp" data-v="${p.rowIndex}">Delete</button></td></tr>`).join('');
  return `<div class="card"><div class="ch"><h3>Record a payment</h3></div><div class="cb"><form data-s="pay">
   <div class="fg" style="max-width:460px"><label>Teacher</label><select name="t" data-c="ptk">${opts(key(t))}</select></div>
   <div class="stats"><div class="stat"><small>Earned</small><b>${money(earned(t))}</b></div><div class="stat g"><small>Paid</small><b>${money(paid(t))}</b></div><div class="stat r"><small>Balance</small><b>${money(bal(t))}</b></div></div>
   <div class="grid"><div><label>Amount (${esc(D().rates.currency)})</label><input name="a" type="number" min="1" step="100" value="${b||''}" required></div>
   <div><label>Date paid</label><input name="d" type="date" value="${today}" required></div>
   <div><label>For month</label><input name="m" type="month" value="${S.ym}" required></div>
   <div><label>Note (optional)</label><input name="n" placeholder="e.g. Part payment"></div></div>
   <p class="hint" style="margin:.7rem 0">Amount is pre-filled with the outstanding balance. Change it for a part payment.</p><button class="btn ok">Save payment</button></form></div></div>
   <div class="card"><div class="ch"><h3>Recent payments</h3></div><div class="tw"><table><thead><tr><th>Date</th><th>Teacher</th><th>Month</th><th>Amount</th><th>Note</th><th></th></tr></thead><tbody>${hist}</tbody></table></div>${hist?'':'<div class="empty">No payments yet.</div>'}</div>`}

function teachers(){
  const ts=D().teachers,u=k=>[...new Set(ts.map(t=>t[k]))].map(v=>`<option value="${esc(v)}">`).join('');
  const rows=ts.map((t,i)=>`<tr><td><div class="n">${esc(t.teacher)}</div><div class="m">${esc(t.subject)} · ${esc(t.class)}</div></td><td>${t.lessons.length}</td>
   <td><button class="sw ${t.showAmount?'on':''}" data-a="vis" data-v="${i}" title="Show amounts to public"></button></td><td><button class="btn red" data-a="delt" data-v="${i}">Delete</button></td></tr>`).join('');
  return `<div class="card"><div class="ch"><h3>Add a teacher</h3></div><div class="cb"><form data-s="teacher"><div class="grid">
   <div><label>Teacher name</label><input name="t" placeholder="e.g. Mrs. Adeyemi" required></div>
   <div><label>Subject</label><input name="s" list="sl" placeholder="e.g. Mathematics" required></div>
   <div><label>Class</label><input name="c" list="cl" placeholder="e.g. SS1" required></div>
   <div><button class="btn" style="width:100%">+ Add teacher</button></div></div>
   <datalist id="sl">${u('subject')}</datalist><datalist id="cl">${u('class')}</datalist></form></div></div>
   <div class="card"><div class="ch"><h3>All teachers (${ts.length})</h3><span class="hint">Switch = show amounts to the public</span></div><div class="tw"><table><thead><tr><th>Teacher</th><th>Lessons</th><th>Public amounts</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${ts.length?'':'<div class="empty">No teachers yet.</div>'}</div>`}

function settings(){
  const r=D().rates,hs=[...D().holidays].sort((a,b)=>a.date<b.date?-1:1).map(h=>`<span class="chip">${esc(h.date)}${h.note?' · '+esc(h.note):''}<button data-a="delh" data-v="${h.rowIndex}" title="Remove">×</button></span>`).join('');
  return `<div class="card"><div class="ch"><h3>Rates</h3></div><div class="cb"><form data-s="rates"><div class="grid">
   <div><label>Weekday rate</label><input name="w" type="number" min="0" step="100" value="${r.weekday}" required></div>
   <div><label>Weekend / holiday rate</label><input name="e" type="number" min="0" step="100" value="${r.weekend}" required></div>
   <div><label>Max lessons per day</label><select name="x">${[1,2].map(n=>`<option ${n===r.maxLessonsPerDay?'selected':''}>${n}</option>`).join('')}</select></div>
   <div><label>Currency symbol</label><input name="c" value="${esc(r.currency)}" maxlength="3" required></div>
   <div><button class="btn" style="width:100%">Save rates</button></div></div></form></div></div>
   <div class="card"><div class="ch"><h3>Holidays</h3><span class="hint">Lessons on holidays earn the weekend rate</span></div><div class="cb"><form data-s="hol"><div class="grid">
   <div><label>Date</label><input name="d" type="date" required></div><div><label>Note (optional)</label><input name="n" placeholder="e.g. Independence Day"></div>
   <div><button class="btn" style="width:100%">+ Add holiday</button></div></div></form><div style="margin-top:.9rem">${hs||'<span class="hint">No holidays added.</span>'}</div></div></div>`}

function render(){
  if(!S.d)return;
  $('#adm').style.display=S.admin?'':'none';
  const ab=$('#authBtn');ab.textContent=S.admin?'Sign out':'Admin sign in';ab.dataset.a=S.admin?'logout':'login';
  const tabs=[['overview','Overview'],['calendar',S.admin?'Record Lessons':'Calendar']];
  if(S.admin)tabs.push(['payments','Payments'],['teachers','Teachers'],['settings','Settings']);
  if(!tabs.some(x=>x[0]===S.tab))S.tab='overview';
  $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('');
  $('#main').innerHTML={overview,calendar,payments,teachers,settings}[S.tab]();
  $('#barHost').innerHTML=bar();
}

/* ---------- ACTIONS ---------- */
const A={
  tab:v=>{S.tab=v;S.pend.clear();render()},
  refresh:()=>{toast('Refreshing…',0,1200);load()},
  pm:v=>{let[y,m]=S.ym.split('-').map(Number);m+=+v;if(m<1){m=12;y--}if(m>12){m=1;y++}S.ym=y+'-'+pad(m);S.pend.clear();render()},
  today:()=>{S.ym=iso(new Date()).slice(0,7);S.pend.clear();render()},
  open:v=>{S.tk=key(D().teachers[v]);S.tab='calendar';S.pend.clear();render();scrollTo(0,0)},
  pick:v=>{S.pend.has(v)?S.pend.delete(v):S.pend.add(v);render()},
  per:v=>{S.per=+v;render()},
  clr:()=>{S.pend.clear();render()},
  wk:()=>{const t=T(),mx=D().rates.maxLessonsPerDay,[y,m]=S.ym.split('-').map(Number);
    for(let d=1;d<=new Date(y,m,0).getDate();d++){const ds=`${y}-${pad(m)}-${pad(d)}`;
      if(!isWE(ds)&&!isHol(ds)&&t.lessons.filter(l=>l.date===ds).length<mx)S.pend.add(ds)}render()},
  save:async()=>{const t=T(),mx=D().rates.maxLessonsPerDay,jobs=[];
    [...S.pend].sort().forEach(ds=>{const ex=t.lessons.filter(l=>l.date===ds).length;for(let i=0;i<Math.min(S.per,mx-ex);i++)jobs.push(ds)});
    if(!jobs.length)return;$('#barHost').innerHTML='';const f={teacher:t.teacher,subject:t.subject,class:t.class};
    await run(async()=>{for(let i=0;i<jobs.length;i++){toast(`Saving ${i+1} of ${jobs.length}…`,'',0);await api('addLesson',{...f,date:jobs[i],dayType:isWE(jobs[i])?'weekend':'weekday'})}S.pend.clear()},jobs.length+' lesson(s) saved')},
  del:v=>{if(confirm('Remove one lesson from this day?'))run(()=>api('deleteLesson',{rowIndex:+v}),'Lesson removed')},
  delp:v=>{if(confirm('Delete this payment?'))run(()=>api('deletePayment',{rowIndex:+v}),'Payment deleted')},
  delh:v=>run(()=>api('deleteHoliday',{rowIndex:+v}),'Holiday removed'),
  vis:v=>{const t=D().teachers[v];run(()=>api('toggleVisibility',{teacher:t.teacher,subject:t.subject,class:t.class,show:!t.showAmount}),'Updated')},
  delt:v=>{const t=D().teachers[v];if(confirm(`Delete ${t.teacher} (${t.subject}, ${t.class}) and ALL their lessons? This cannot be undone.`))run(()=>api('deleteTeacher',{teacher:t.teacher,subject:t.subject,class:t.class}),'Teacher deleted')},
  login:()=>{$('#lm').classList.add('show');setTimeout(()=>$('#lm input').focus(),80)},
  closeLogin:()=>$('#lm').classList.remove('show'),
  logout:()=>{sessionStorage.removeItem('gtmc');S.admin=false;S.pend.clear();render()},
  export:()=>{const m=S.ym,rows=[['Date','Teacher','Subject','Class','Type','Rate']];
    D().teachers.forEach(t=>t.lessons.filter(l=>l.date.startsWith(m)).forEach(l=>rows.push([l.date,t.teacher,t.subject,t.class,isHol(l.date)?'holiday':isWE(l.date)?'weekend':'weekday',rateOf(l.date)])));
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv'}));a.download='GTMC_lessons_'+m+'.csv';a.click()}
};
const C={tk:v=>{S.tk=v;S.pend.clear();render()},ptk:v=>{S.ptk=v;render()}};
const F={
  login:async(fd,f)=>{try{await api('login',{username:fd.get('u'),password:fd.get('p')});sessionStorage.setItem('gtmc','1');S.admin=true;f.reset();A.closeLogin();toast('✓ Signed in');render()}catch(e){toast(e.message,'err')}},
  teacher:(fd)=>run(()=>api('registerTeacher',{teacher:fd.get('t').trim(),subject:fd.get('s').trim(),class:fd.get('c').trim()}),'Teacher added'),
  pay:(fd)=>{const t=PT();return run(()=>api('addPayment',{teacher:t.teacher,subject:t.subject,class:t.class,amount:fd.get('a'),date:fd.get('d'),month:fd.get('m'),note:fd.get('n')}),'Payment saved')},
  rates:(fd)=>run(()=>api('updateRates',{rateWeekday:+fd.get('w'),rateWeekend:+fd.get('e'),maxLessonsPerDay:+fd.get('x'),currency:fd.get('c')}),'Rates saved'),
  hol:(fd)=>run(()=>api('addHoliday',{date:fd.get('d'),note:fd.get('n')}),'Holiday added')
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el);else if(e.target.id==='lm')A.closeLogin()});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el)C[el.dataset.c](el.value)});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.s;if(F[f])F[f](new FormData(e.target),e.target)});
load();
</script>
</body>
</html>
